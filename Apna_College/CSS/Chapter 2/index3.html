<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline-Block</title>
    <style>
        div, p{
            height: 100px;
            justify-content: center;
            align-items: center;
            background-color: green;
            width: 200px;
            display: inline-block;
            margin-top: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div>
        <p>1</p>
    </div>
    <div>
        <p>2</p>
    </div>
    <p>Hello</p>
</body>
</html>
