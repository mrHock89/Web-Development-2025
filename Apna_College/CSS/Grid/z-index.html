<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>z-index</title>
    <style>
        .box{
            height: 100px;
            width: 100px;
            align-content: center;
            text-align: center;
            margin-bottom: 10px;
        }
        .one{
            background-color: red;
            /* position: absolute; */
            position: relative;
            left: 50px;
        }
        .two{
            background-color: green;
            position: relative;
            z-index: 1;
            top: 50px
        }
        .three{
            background-color: blue;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="box one">1</div>
    <div class="box two">2</div>
    <div class="box three">3</div>
</body>
</html>
